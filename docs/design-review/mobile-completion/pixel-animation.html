<style>
*{box-sizing:border-box}body{margin:0;background:#181818;color:#eee;font:15px/1.5 -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif}main{max-width:960px;margin:0 auto;padding:32px 20px;display:flex;align-items:center;justify-content:center;gap:44px}.phone{position:relative;flex-shrink:0;width:390px;height:760px;border-radius:32px;overflow:hidden;background:#272727;border:1px solid #555}.header{height:100px;display:flex;justify-content:center;align-items:end;padding:18px}.header svg{width:28px;height:28px}.content{position:absolute;inset:100px 28px 92px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}.target{width:100px;height:100px;display:grid;place-items:center;border-radius:50%;background:#ffffff0f}.print svg{width:52px;height:54px}h1{font-size:25px;letter-spacing:-.6px;margin:28px 0 12px}p{font-size:17px;margin:0}.next{position:absolute;bottom:32px;left:28px;right:28px;height:52px;background:#fff;color:#1b1b1b;border:0;border-radius:14px;font-size:16px}.actor{position:absolute;top:0;left:0;width:210px;height:560px;pointer-events:none}.actor>svg{display:block}.arm{position:absolute;left:133px;top:385px;width:77px;height:133px}.panel{max-width:290px}.panel h2{font-size:23px;margin:0 0 16px}.panel p{font-size:15px;color:#b9b9b9;line-height:1.8}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0}button{font:inherit;cursor:pointer;min-height:44px;padding:8px 14px;border:1px solid #777;border-radius:8px;background:#333;color:white}button:focus-visible,input:focus-visible{outline:3px solid #ddd;outline-offset:4px}input[type=range]{width:100%;accent-color:#ddd;min-height:44px}.steps{display:flex;gap:8px}.steps button{padding:8px 10px;font-size:13px}.small{font-size:12px!important;margin-top:20px!important}@media(max-width:740px){main{flex-direction:column;padding:20px 12px;gap:24px}.phone{width:min(390px,calc(100vw - 24px));height:700px}.panel{max-width:390px;width:100%}}@media(prefers-reduced-motion:reduce){.actor{display:none}}

</div><div class="content"><div class="target"><div class="print"><img src="pixel-paw.svg" width="52" height="52" alt="하루 마무리 픽셀 발도장">
</div></div><h1>오늘도 집중을 쌓았어요.</h1><p>기획안 작성</p></div><button class="next" type="button">오늘 마무리</button><div class="actor" aria-hidden="true"></div></div><div class="panel"><h2>꾹 찍고, 위로 쏙.</h2><p>하루를 마무리할 때 내려오는<br>8프레임 픽셀 고양이입니다.<br>하루 마무리 도장만 픽셀로 찍어요.<br>일반 집중 완료는 기존 아이콘이에요.</p><div id="directions" class="controls" aria-label="고양이 등장 방향"></div><div class="controls"><button id="play">다시 보기</button><button id="reduce" aria-pressed="false">동작 줄이기</button></div><label for="frame">동작 살펴보기</label><input id="frame" type="range" min="0" max="1" step="0.001" value="0"><div class="steps"><button data-frame="0.36">내려오기</button><button data-frame="0.55">찍기</button><button data-frame="1">사라지기</button></div><p class="small">앱과 같은 위치 계산을 쓰는 동작 미리보기입니다. 실제 앱은 오늘 집중 횟수를 함께 세어요.</p></div></main><script type="module">
import {catSheet as sheet, CAT_WIDTH, CAT_HEIGHT, CAT_REGISTER_X, CAT_PAW_X, CAT_PAW_Y, CAT_ENTRIES, nextCatEntry, catEntryGeometry} from './completion-geometry.js';
const actor=document.querySelector('.actor'),stamp=document.querySelector('.print'),phone=document.querySelector('.phone'),slider=document.querySelector('#frame'),title=document.querySelector('.content h1');
actor.style.overflow='visible';actor.innerHTML='<div class="sprite-canvas" style="position:absolute;overflow:hidden"><div class="sprite-clip" style="position:absolute;overflow:hidden"><img src="cat-stamp-pixel-v1.png" alt="" style="position:absolute;image-rendering:pixelated;max-width:none"></div></div>';
const canvas=actor.querySelector('.sprite-canvas'),clip=actor.querySelector('.sprite-clip'),sprite=clip.querySelector('img');
const times=[0,.36,.46,.53,.63,.72,1],duration=[600,160,110,170,160,430];let raf=0,reduced=matchMedia('(prefers-reduced-motion:reduce)').matches,entry='top';
function frameOf(p){return p<.36?0:p<.4?1:p<.46?2:p<.63?3:p<.665?4:p<.69?6:p<.72?5:7}
function interp(p,knots,values){let i=knots.findIndex(k=>k>=p);if(i<=0)return values[0];const t=(p-knots[i-1])/(knots[i]-knots[i-1]);return values[i-1]+(values[i]-values[i-1])*t}
function draw(p){
 slider.value=p;const box=document.querySelector('.target').getBoundingClientRect(),screen=phone.getBoundingClientRect(),target={x:box.left-screen.left+50,y:box.top-screen.top+50};
 const {scale,dx,dy,angle,travel,stampRotation}=catEntryGeometry(entry,target,{width:screen.width,height:screen.height}),side=CAT_HEIGHT*scale,frame=sheet.frames[frameOf(p)],distance=interp(p,times,[travel,20,8,0,0,12,travel]);
 actor.style.width=actor.style.height=side+'px';actor.style.left=target.x-side/2+'px';actor.style.top=target.y-side/2+'px';actor.style.transform=`translate(${dx*distance}px,${dy*distance}px) rotate(${angle}deg)`;actor.style.opacity=reduced?0:interp(p,[0,.01,.99,1],[0,1,1,0]);
 canvas.style.left=side/2-CAT_PAW_X*scale+'px';canvas.style.top=side/2-CAT_PAW_Y*scale+'px';canvas.style.width=CAT_WIDTH*scale+'px';canvas.style.height=CAT_HEIGHT*scale+'px';
 clip.style.left=(CAT_REGISTER_X-frame.anchor.x)*scale+'px';clip.style.top=-frame.anchor.y*scale+'px';clip.style.width=frame.rect.width*scale+'px';clip.style.height=frame.rect.height*scale+'px';sprite.style.width=sheet.width*scale+'px';sprite.style.height=sheet.height*scale+'px';sprite.style.left=-frame.rect.x*scale+'px';sprite.style.top=-frame.rect.y*scale+'px';
 stamp.style.opacity=reduced?1:interp(p,[0,.53,.55,1],[0,0,1,1]);stamp.style.transform=`scale(${reduced?1:interp(p,[0,.53,.58,.66,1],[.86,.86,1.04,1,1])}) rotate(${stampRotation}deg)`;title.style.opacity=reduced?1:interp(p,[0,.8,1],[0,0,1]);
}
function play(){cancelAnimationFrame(raf);if(reduced){draw(1);return}const start=performance.now();function tick(now){let elapsed=now-start,i=0;while(i<duration.length-1&&elapsed>duration[i])elapsed-=duration[i++];let t=Math.min(1,elapsed/duration[i]);if(i===0)t=1-(1-t)**3;else if(i===5)t=t**3;draw(times[i]+(times[i+1]-times[i])*t);if(now-start<1630)raf=requestAnimationFrame(tick);else draw(1)}raf=requestAnimationFrame(tick)}
function setEntry(next){entry=next;document.querySelectorAll('[data-entry]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.entry===entry)))}
for(const direction of CAT_ENTRIES){const button=document.createElement('button');button.textContent=direction.label;button.dataset.entry=direction.id;button.setAttribute('aria-pressed',String(direction.id===entry));button.onclick=()=>{setEntry(direction.id);play()};document.querySelector('#directions').append(button)}
slider.oninput=()=>{cancelAnimationFrame(raf);draw(+slider.value)};document.querySelector('#play').onclick=()=>{setEntry(nextCatEntry(entry));play()};document.querySelector('#reduce').setAttribute('aria-pressed',reduced);document.querySelector('#reduce').onclick=e=>{reduced=!reduced;e.currentTarget.setAttribute('aria-pressed',reduced);cancelAnimationFrame(raf);draw(1)};document.querySelectorAll('[data-frame]').forEach(b=>b.onclick=()=>{cancelAnimationFrame(raf);draw(+b.dataset.frame)});document.querySelector('.next').onclick=()=>{cancelAnimationFrame(raf);draw(1)};window.addEventListener('resize',()=>draw(+slider.value));draw(0);play();
</script></html>
