<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>냐우포커스 · PC UI 검토</title><style>
*{box-sizing:border-box}body{margin:0;background:#efeeeb;color:#242424;font:15px -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif}button,input{font:inherit}button{cursor:pointer}header{max-width:1060px;margin:48px auto 28px;padding:0 24px}header small{color:#666}h1{font-size:28px;font-weight:600;letter-spacing:-.8px;margin:12px 0}header p{line-height:1.7;color:#626262;max-width:740px}.review{max-width:1060px;margin:auto;padding:0 24px 60px;display:grid;grid-template-columns:210px 1fr;gap:40px}nav{display:flex;flex-direction:column;gap:6px}nav button{text-align:left;background:none;border:0;border-radius:7px;padding:12px;color:#646464}nav button[aria-pressed=true]{background:#deded9;color:#171717;font-weight:600}.stage{min-height:500px;padding:28px 20px;display:flex;justify-content:center;align-items:flex-start;background:#d8d8d3;border-radius:16px}.app{width:402px;color:#eee;background:#343636;border:1px solid #6b6c69;border-radius:12px;box-shadow:0 5px 16px #0002;overflow:hidden;flex-shrink:0}.top{height:30px;padding:7px 12px;display:flex;align-items:center;justify-content:space-between;color:#b9bab8;font-size:11px}.cat{width:20px;height:20px}.top button,.back{border:0;background:none;color:#bbb;padding:0;min-width:22px}.body{padding:12px}.task{border-radius:8px;background:#ffffff06;padding:20px 16px;font-size:15px;display:flex;align-items:center;justify-content:center;min-height:88px;flex:1}.focus{display:flex;gap:16px;align-items:center;padding:10px}.timer{width:76px;text-align:center;font-size:12px}.ring{width:58px;height:58px;border-radius:50%;border:6px solid #fff;margin:0 auto 7px;position:relative}.ring:after{content:'';position:absolute;left:20px;top:6px;width:5px;height:19px;border-radius:3px;background:#fff}.footer{border-top:1px solid #ffffff14;display:flex;justify-content:center;align-items:center;min-height:48px}.footer button{background:none;color:#eee;border:0;padding:12px;flex:1;font-size:13px}.settings{padding:10px 22px 24px;min-height:438px}.heading{display:flex;align-items:center;gap:12px;font-size:16px;font-weight:600;margin-bottom:26px}.group{padding:0 0 22px;margin-bottom:20px;border-bottom:1px solid #ffffff12}.group:last-child{border:0;margin:0;padding:0}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.label{font-size:13px}.sub{font-size:12px;color:#b5b8b5;line-height:1.6;margin-top:9px;max-width:310px}.toggle{width:38px;height:23px;border:0;border-radius:12px;background:#626563;padding:3px;flex-shrink:0}.toggle:before{display:block;content:'';height:17px;width:17px;border-radius:50%;background:#fff;transition:transform .15s}.toggle[aria-checked=true]{background:#d7ddd8}.toggle[aria-checked=true]:before{transform:translateX(15px);background:#343636}.segment{display:flex;gap:3px;margin-top:13px;background:#ffffff06;border-radius:7px;padding:3px}.segment button{flex:1;border:0;background:none;color:#bbb;border-radius:5px;padding:7px 0;font-size:12px}.segment button.selected{background:#ddd;color:#222}.colors{display:flex;gap:12px;margin-top:15px}.colors button{border:0;width:22px;height:22px;border-radius:50%;background:var(--c)}.colors button.selected{outline:1px solid white;outline-offset:3px}.textbtn{border:0;background:none;color:#eee;padding:6px 0;font-size:12px;text-decoration:underline;text-underline-offset:4px}.note{margin:20px 0;color:#666;font-size:13px;line-height:1.8}.readyinput{width:100%;height:75px;border:0;background:#ffffff06;border-radius:7px;padding:18px;color:white;outline-offset:2px;text-align:center}.quiet{color:#aaa!important}.pick{display:flex;justify-content:space-between;align-items:center;background:none;width:100%;color:white;border:0;border-bottom:1px solid #ffffff12;padding:16px 0;text-align:left;font-size:14px}.pick small{display:block;color:#aaa;font-size:11px;margin-top:5px}.notice{display:flex;justify-content:space-between;align-items:center;color:#aaa;font-size:12px;padding-top:12px}.statuscontrols{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.statuscontrols button{border:1px solid #b6b7b2;background:transparent;border-radius:6px;padding:7px 10px;font-size:12px}.sr{position:absolute;clip:rect(0,0,0,0)}@media(max-width:740px){.review{display:block}.stage{overflow:auto;justify-content:flex-start}nav{flex-direction:row;flex-wrap:wrap;margin-bottom:15px}header{margin-top:24px}}
</style><header><small>PC 변경 UI · 검토용 시안 / 앱 미적용</small><h1>집중 화면에는, 지금 할 일만.</h1><p>기존 차콜 창·고양이·흰 타이머를 유지합니다. 연결 상태를 상단에 붙이지 않고 설정 안으로 옮겼습니다. 아래 메뉴는 시안 비교용이며 실제 앱 메뉴가 아닙니다.</p></header><div class="review"><nav id="nav"></nav><main><div class="stage"><div class="app" id="app"></div></div><div class="statuscontrols" id="controls"></div><p class="note" id="note"></p></main></div><script>
const names=['집중 중','시작 전','설정 · 정상','설정 · 연결 오류','기록 · 삭제 후','집중 충돌'];let current=0,on=true,state='normal';const cat='<img class="cat" src="cat.svg" alt="고양이">';const appTop=()=>`<div class="top">${cat}<button aria-label="창 최소화">−</button></div>`;
const notes=['상단 연결 문구를 없앱니다. 연결이 끊겨도 집중 화면을 가리거나 새 버튼을 붙이지 않습니다.','PC에서는 첫 작업 제안을 표시하지 않습니다. 바로 할 일을 입력하고 집중을 시작합니다.','402 × 468 기준. 연결·시간·색을 한 창에 배치합니다. 정상 상태는 짧게, 토글은 키보드로도 조작할 수 있습니다.','오류는 설정 안의 연결 설명만 대체합니다. 기술 오류 원문과 상단 경고를 제거합니다. 화면 높이는 정상 상태와 같습니다.','삭제 안내는 기록 화면 하단 한 줄에만 표시합니다. 기존 기록 목록은 유지하고 실행 취소만 제공합니다.','집중 충돌 때만 기존 창 안에서 선택합니다. 작은 창 위에 또 작은 팝업을 띄우지 않습니다. 선택하지 않은 작업도 기록에 남습니다.'];
function settings(error){return `<div class="settings"><div class="heading"><button class="back" aria-label="뒤로" onclick="show(0)">‹</button>설정</div><section class="group"><div class="row"><span class="label">iCloud 동기화</span><button class="toggle" role="switch" aria-label="iCloud 동기화" aria-checked="${on}" onclick="on=!on;render()"></button></div><div class="sub">${!on?'이 Mac에서만 집중과 기록을 보관해요.':error?'지금은 연결할 수 없어요.<br>집중과 기록은 이 Mac에 보관돼요.':'iPhone과 집중·기록을 함께 사용해요.'}</div>${error&&on?'<button class="textbtn" onclick="this.textContent=\'확인 중…\';setTimeout(()=>{this.textContent=\'다시 시도\'},900)">다시 시도</button>':''}</section><section class="group"><div class="label">집중 시간</div><div class="segment">${[15,25,45,60].map(n=>`<button class="${n===25?'selected':''}" onclick="this.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('selected'));this.classList.add('selected')">${n}분</button>`).join('')}</div></section><section class="group"><div class="label">테마 색상</div><div class="colors">${['#eee','#00ff85','#69a9f2','#b99bfa','#f18fba','#e9a166','#eed57a'].map((c,i)=>`<button style="--c:${c}" class="${i===0?'selected':''}" aria-label="${['흰색','초록','파랑','보라','분홍','주황','노랑'][i]}" onclick="this.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('selected'));this.classList.add('selected')"></button>`).join('')}</div></section></div>`}
function render(){let body='';if(current===0)body=appTop()+`<div class="body focus"><div class="task">기획안 작성</div><div class="timer"><div class="ring"></div>24:57</div></div><div class="footer"><button>작은 창 보기 ↵</button></div>`;if(current===1)body=appTop()+`<div class="body"><input class="readyinput" id="task" aria-label="지금 할 일" placeholder="지금 할 일 하나"></div><div class="footer"><button onclick="if(document.getElementById('task').value.trim())show(0)">집중 시작</button></div>`;if(current===2||current===3)body=appTop()+settings(current===3);if(current===4)body=appTop()+`<div class="settings" style="min-height:240px"><div class="heading">오늘의 집중</div><div class="pick">기획안 작성 <small>25분</small></div><div class="pick">자료 살펴보기 <small>15분</small></div><div class="notice"><span>기록 1개 삭제됨</span><button class="textbtn" onclick="this.parentElement.outerHTML='<div class=pick>복구한 집중 기록 <small>25분</small></div>'">실행 취소</button></div></div>`;if(current===5)body=appTop()+`<div class="settings" style="min-height:260px"><div class="heading">어떤 집중을 이어갈까요?</div><button class="pick" onclick="show(0)"><span>기획안 작성<small>이 Mac · 18분 남음</small></span>›</button><button class="pick" onclick="show(0)"><span>책 읽기<small>iPhone · 12분 남음</small></span>›</button><div class="sub">다른 집중도 기록에 남아요.</div></div>`;document.getElementById('app').innerHTML=body;document.getElementById('note').textContent=notes[current];document.querySelectorAll('nav button').forEach((b,i)=>b.setAttribute('aria-pressed',i===current));}function show(i){current=i;render()}document.getElementById('nav').innerHTML=names.map((n,i)=>`<button onclick="show(${i})">${n}</button>`).join('');render();</script></html>
